<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>і. капча</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #141414;
      --muted: #9a9a9a;
      --line: #e7e7e7;
      --accent: #5be37b;
    }

    html, body { height: 100%; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
    }

    /* ─── one-line strip ─── */
    .captcha {
      position: relative;
      width: min(440px, 94vw);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px -24px rgba(0, 0, 0, 0.3);
      transition: border-color 0.25s;
    }
    .captcha.ok { border-color: #a6e3bd; }
    .captcha.bad { border-color: #f0b4bf; }

    .strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
    }

    /* ─── brand ─── */
    .brand { display: flex; align-items: baseline; gap: 5px; flex: none; padding-right: 2px; }

    .brand__mark {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand__mark .dot { color: var(--accent); }

    .brand__name {
      font-family: 'Unbounded', sans-serif;
      font-weight: 300;
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── code image ─── */
    canvas {
      flex: none;
      width: 120px;
      height: 42px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #eef1f8;
      cursor: pointer;
    }

    /* ─── controls ─── */
    input {
      flex: 1 1 80px;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #c4c4c4; letter-spacing: 1px; }
    input:focus { border-color: #bcbcbc; }
    input:disabled { opacity: 0.55; }

    .check {
      flex: none;
      height: 42px;
      padding: 0 13px;
      border: none;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .check:hover { background: #000; }
    .check:disabled { opacity: 0.4; cursor: default; }

    .refresh {
      flex: none;
      width: 34px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #a2a2a2;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .refresh:hover { color: var(--ink); border-color: #d2d2d2; }
    .refresh:active { transform: rotate(-180deg); }
    .refresh:disabled { opacity: 0.4; cursor: default; }

    /* ─── caption under the strip ─── */
    .msg {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      min-height: 13px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .msg.ok { color: #1a9e4b; }
    .msg.bad { color: #e0344b; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .captcha.shake { animation: shake 0.36s; }

    @media (max-width: 480px) {
      .brand__name { display: none; }
      canvas { width: 104px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="captcha" id="captcha">
    <div class="strip">
      <span class="brand">
        <span class="brand__mark">і<span class="dot">.</span></span>
        <span class="brand__name">капча</span>
      </span>

      <canvas id="cv" title="Обновить код" role="img" aria-label="Капча: нажмите, чтобы обновить"></canvas>

      <input id="inp" type="text" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" placeholder="код" aria-label="Код с картинки">

      <button class="check" id="check" type="button">Проверить</button>
      <button class="refresh" id="refresh" type="button" title="Обновить код" aria-label="Обновить код">↻</button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      var cv = document.getElementById('cv');
      var inp = document.getElementById('inp');
      var check = document.getElementById('check');
      var refresh = document.getElementById('refresh');
      var msg = document.getElementById('msg');
      var card = document.getElementById('captcha');

      var CHARS = 'ACDEFGHJKLMNPQRSTUVWXYZ23456789';
      var PALETTE = ['#4b2ea6', '#1f4f8a', '#8a2b57', '#2b7a5f', '#7a4a12', '#5a2b8a'];
      var H = 42;

      var code = '';
      var solved = false;

      function rand(n) { return Math.floor(Math.random() * n); }
      function pick(arr) { return arr[rand(arr.length)]; }
      function newCode() {
        var s = '';
        for (var i = 0; i < 5; i++) s += CHARS[rand(CHARS.length)];
        return s;
      }

      function ctx2d() {
        var w = cv.clientWidth || 120;
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(H * dpr);
        cv.style.height = H + 'px';
        var x = cv.getContext('2d');
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { x: x, w: w, h: H };
      }

      function drawBackground(x, w, h) {
        var g = x.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#f5f7fc');
        g.addColorStop(1, '#e2e7f2');
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
      }

      function drawNoise(x, w, h) {
        for (var i = 0; i < 80; i++) {
          x.fillStyle = 'rgba(' + (50 + rand(130)) + ',' + (60 + rand(120)) + ',' + (110 + rand(120)) + ',' + (0.12 + Math.random() * 0.24).toFixed(2) + ')';
          x.fillRect(Math.random() * w, Math.random() * h, 1, 1);
        }
      }

      function drawLines(x, w, h) {
        for (var l = 0; l < 2; l++) {
          x.strokeStyle = 'rgba(' + (90 + rand(80)) + ',' + (80 + rand(80)) + ',' + (150 + rand(70)) + ',' + (0.18 + Math.random() * 0.16).toFixed(2) + ')';
          x.lineWidth = 1 + Math.random();
          x.beginPath();
          var y = 7 + Math.random() * (h - 14);
          x.moveTo(0, y);
          x.bezierCurveTo(w * 0.33, y + (Math.random() - 0.5) * 20, w * 0.66, y + (Math.random() - 0.5) * 20, w, y + (Math.random() - 0.5) * 10);
          x.stroke();
        }
      }

      function drawGlyphs(x, w, h) {
        var n = code.length;
        var pad = 9;
        var step = (w - pad * 2) / n;
        var size = Math.max(15, Math.min(24, Math.round(step * 0.92)));
        for (var k = 0; k < n; k++) {
          x.save();
          var cx = pad + step * k + step / 2;
          var cy = h / 2 + (Math.random() - 0.5) * 5;
          x.translate(cx, cy);
          x.rotate((Math.random() - 0.5) * 0.5);
          x.font = '700 ' + size + 'px "Arial Black", Arial, sans-serif';
          x.textAlign = 'center';
          x.textBaseline = 'middle';
          x.fillStyle = pick(PALETTE);
          x.fillText(code[k], 0, 0);
          x.restore();
        }
      }

      function drawCode() {
        var c = ctx2d();
        drawBackground(c.x, c.w, c.h);
        drawNoise(c.x, c.w, c.h);
        drawLines(c.x, c.w, c.h);
        drawGlyphs(c.x, c.w, c.h);
      }

      function drawSolved() {
        var c = ctx2d();
        var x = c.x, w = c.w, h = c.h;
        var g = x.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#eafbf1');
        g.addColorStop(1, '#d7f5e3');
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
        x.strokeStyle = '#1a9e4b';
        x.lineWidth = 3;
        x.lineCap = 'round';
        x.lineJoin = 'round';
        x.beginPath();
        x.moveTo(w / 2 - 12, h / 2 + 1);
        x.lineTo(w / 2 - 3, h / 2 + 10);
        x.lineTo(w / 2 + 13, h / 2 - 9);
        x.stroke();
      }

      function setMsg(t, cls) {
        msg.textContent = t;
        msg.className = 'msg' + (cls ? ' ' + cls : '');
      }
      function shake() {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }

      function refreshCode() {
        if (solved) return;
        code = newCode();
        drawCode();
        inp.value = '';
        setMsg('');
        card.classList.remove('ok', 'bad');
      }

      function success() {
        solved = true;
        drawSolved();
        card.classList.add('ok');
        card.classList.remove('bad');
        setMsg('Проверка пройдена', 'ok');
        inp.disabled = true;
        check.disabled = true;
        refresh.disabled = true;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'captcha-success', source: 'i-studio' }, '*');
          }
        } catch (e) {}
      }

      function fail() {
        card.classList.add('bad');
        card.classList.remove('ok');
        setMsg('Неверный код, попробуйте ещё раз', 'bad');
        shake();
        inp.value = '';
        window.setTimeout(function () {
          if (solved) return;
          code = newCode();
          drawCode();
          inp.focus();
        }, 420);
      }

      function checkCode() {
        if (solved) return;
        var val = inp.value.trim().toUpperCase();
        if (!val) { setMsg('Введите код', 'bad'); card.classList.add('bad'); return; }
        if (val === code) success();
        else fail();
      }

      check.addEventListener('click', checkCode);
      refresh.addEventListener('click', refreshCode);
      cv.addEventListener('click', refreshCode);
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); checkCode(); }
      });
      inp.addEventListener('input', function () {
        inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
      window.addEventListener('resize', function () {
        if (solved) drawSolved(); else drawCode();
      });

      code = newCode();
      drawCode();
    })();
  </script>
</body>
</html>
