<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>і. капча</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #141414;
      --muted: #9a9a9a;
      --line: #e7e7e7;
      --accent: #5be37b;
    }

    html, body { height: 100%; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
    }

    /* ─── one-line strip ─── */
    .captcha {
      position: relative;
      width: min(460px, 94vw);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px -24px rgba(0, 0, 0, 0.3);
      transition: border-color 0.25s;
    }
    .captcha.ok { border-color: #a6e3bd; }
    .captcha.bad { border-color: #f0b4bf; }

    .strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
    }

    /* ─── brand ─── */
    .brand { display: flex; align-items: baseline; gap: 5px; flex: none; padding-right: 2px; }

    .brand__mark {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand__mark .dot { color: var(--accent); }

    .brand__name {
      font-family: 'Unbounded', sans-serif;
      font-weight: 300;
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── code image (security-print look) ─── */
    canvas {
      flex: none;
      width: 146px;
      height: 44px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #eef1f8;
      cursor: pointer;
    }

    /* ─── controls ─── */
    input {
      flex: 1 1 70px;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 8px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #c4c4c4; letter-spacing: 1px; }
    input:focus { border-color: #bcbcbc; }
    input:disabled { opacity: 0.55; }

    .check {
      flex: none;
      height: 44px;
      padding: 0 13px;
      border: none;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .check:hover { background: #000; }
    .check:disabled { opacity: 0.4; cursor: default; }

    .refresh {
      flex: none;
      width: 34px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #a2a2a2;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .refresh:hover { color: var(--ink); border-color: #d2d2d2; }
    .refresh:active { transform: rotate(-180deg); }
    .refresh:disabled { opacity: 0.4; cursor: default; }

    /* ─── honeypot (bots only) ─── */
    .hp {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      tab-size: 0;
    }

    /* ─── caption under the strip ─── */
    .msg {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      min-height: 13px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .msg.ok { color: #1a9e4b; }
    .msg.bad { color: #e0344b; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .captcha.shake { animation: shake 0.36s; }

    @media (max-width: 520px) {
      .brand__name { display: none; }
      canvas { width: 116px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="captcha" id="captcha">
    <div class="strip">
      <span class="brand">
        <span class="brand__mark">і<span class="dot">.</span></span>
        <span class="brand__name">капча</span>
      </span>

      <canvas id="cv" title="Обновить код" role="img" aria-label="Капча: нажмите, чтобы обновить"></canvas>

      <input id="inp" type="text" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" placeholder="код" aria-label="Код с картинки">
      <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button class="check" id="check" type="button">Проверить</button>
      <button class="refresh" id="refresh" type="button" title="Обновить код" aria-label="Обновить код">↻</button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      var cv = document.getElementById('cv');
      var inp = document.getElementById('inp');
      var hp = document.getElementById('hp');
      var check = document.getElementById('check');
      var refresh = document.getElementById('refresh');
      var msg = document.getElementById('msg');
      var card = document.getElementById('captcha');

      var CHARS = 'ACDEFGHJKLMNPQRSTUVWXYZ23456789';
      var PALETTE = ['#3a2a86', '#17457c', '#7c254c', '#1f6b4f', '#6b4510', '#4a2274'];
      var INKS = ['rgba(40,70,140,', 'rgba(150,50,110,', 'rgba(30,120,110,'];
      var H = 44;

      var code = '';
      var solved = false;

      function rand(n) { return Math.floor(Math.random() * n); }
      function pick(a) { return a[rand(a.length)]; }
      function newCode() {
        var s = '';
        for (var i = 0; i < 5; i++) s += CHARS[rand(CHARS.length)];
        return s;
      }

      function ctx2d() {
        var w = cv.clientWidth || 146;
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(H * dpr);
        cv.style.height = H + 'px';
        var x = cv.getContext('2d');
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { x: x, w: w, h: H, dpr: dpr };
      }

      /* ── paper ── */
      function drawPaper(x, w, h) {
        var g = x.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#f8f7f0');
        g.addColorStop(0.5, '#eef1ef');
        g.addColorStop(1, '#e5ebf3');
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
        for (var i = 0; i < 3; i++) {
          var rg = x.createRadialGradient(Math.random() * w, Math.random() * h, 1, Math.random() * w, Math.random() * h, Math.max(w, h) * 0.7);
          rg.addColorStop(0, pick(['rgba(90,120,200,0.05)', 'rgba(120,90,180,0.05)', 'rgba(90,170,120,0.04)']));
          rg.addColorStop(1, 'rgba(0,0,0,0)');
          x.fillStyle = rg;
          x.fillRect(0, 0, w, h);
        }
      }

      /* ── guilloche rosettes ── */
      function drawGuilloche(x, w, h) {
        var cx = w / 2, cy = h / 2;
        var R = Math.min(w, h) * 1.15;
        for (var c = 0; c < 3; c++) {
          x.strokeStyle = INKS[c] + '0.10)';
          x.lineWidth = 0.7;
          x.beginPath();
          var k = 3 + c;
          var amp = 0.45 + 0.1 * c;
          for (var i = 0; i <= 720; i++) {
            var a = i * Math.PI / 180;
            var rr = R * 0.6 * (0.55 + amp * Math.cos(k * a));
            var px = cx + Math.cos(a) * rr * 1.05 + Math.cos(a * (k + 1)) * 2;
            var py = cy + Math.sin(a) * rr * 0.9 + Math.sin(a * (k + 1)) * 2;
            if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
          }
          x.stroke();
        }
      }

      /* ── microtext ── */
      function drawMicroText(x, w, h) {
        var txt = 'І·КАПЧА·ЗАЩИТА·';
        x.font = '4px Arial, sans-serif';
        x.textBaseline = 'alphabetic';
        x.textAlign = 'left';
        for (var row = 0, y = 8; y < h + 6; row++, y += 8) {
          x.fillStyle = (row % 2 ? 'rgba(40,70,140,0.14)' : 'rgba(150,50,110,0.13)');
          var off = (row % 2) ? 7 : 0;
          for (var px = -off; px < w + 15; px += 15) x.fillText(txt, px, y);
        }
      }

      /* ── security thread ── */
      function drawThread(x, w, h) {
        x.save();
        x.strokeStyle = 'rgba(30,50,110,0.32)';
        x.lineWidth = 1.1;
        x.setLineDash([3, 2.5]);
        x.beginPath();
        var base = w * 0.72;
        for (var y = 0; y <= h; y += 2) {
          var xx = base + Math.sin(y * 0.16) * 2.5;
          if (y === 0) x.moveTo(xx, y); else x.lineTo(xx, y);
        }
        x.stroke();
        x.setLineDash([]);
        x.restore();
      }

      /* ── watermark ── */
      function drawWatermark(x, w, h) {
        x.save();
        x.fillStyle = 'rgba(40,70,140,0.06)';
        x.font = '700 ' + Math.round(h * 0.86) + 'px "Arial Black", Arial, sans-serif';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText('і', w / 2, h / 2 + 1);
        x.restore();
      }

      /* ── glyph layer (offscreen, then warped) ── */
      function drawGlyphLayer(x, w, h) {
        var n = code.length;
        var pad = 14;
        var step = (w - pad * 2) / n;
        x.textAlign = 'center';
        x.textBaseline = 'middle';

        // decoy ghost characters
        for (var d = 0; d < 3; d++) {
          x.save();
          x.globalAlpha = 0.12;
          x.fillStyle = pick(['#5a3a1f', '#2b7a5f', '#1f4f8a']);
          x.font = 'italic 600 ' + (16 + rand(8)) + 'px "Arial Black", Arial, sans-serif';
          x.translate(Math.random() * w, h / 2 + (Math.random() - 0.5) * 9);
          x.rotate((Math.random() - 0.5) * 0.9);
          x.fillText(pick(CHARS), 0, 0);
          x.restore();
        }

        // connecting baseline (anti-segmentation)
        x.save();
        x.strokeStyle = 'rgba(30,40,80,0.45)';
        x.lineWidth = 1.1;
        x.beginPath();
        var y0 = h / 2 + 7 + Math.random() * 2;
        x.moveTo(pad - 8, y0);
        x.bezierCurveTo(w * 0.3, y0 + (Math.random() - 0.5) * 8, w * 0.7, y0 + (Math.random() - 0.5) * 8, w - pad + 8, y0 + (Math.random() - 0.5) * 4);
        x.stroke();
        x.restore();

        // main glyphs with intaglio relief
        for (var k = 0; k < n; k++) {
          x.save();
          var cx = pad + step * k + step / 2;
          var cy = h / 2 + (Math.random() - 0.5) * 4;
          x.translate(cx, cy);
          x.rotate((Math.random() - 0.5) * 0.5);
          var size = Math.max(15, Math.min(24, Math.round(step * 0.92)));
          x.font = '700 ' + size + 'px "Arial Black", Arial, sans-serif';
          x.shadowColor = 'rgba(255,255,255,0.85)';
          x.shadowOffsetX = 1;
          x.shadowOffsetY = 1;
          x.shadowBlur = 0.5;
          x.fillStyle = pick(PALETTE);
          x.fillText(code[k], 0, 0);
          x.restore();
        }
      }

      /* ── wave warp blit ── */
      function warpBlit(x, off, w, h, dpr) {
        var slice = 2;
        for (var sx = 0; sx < w; sx += slice) {
          var t = sx / w;
          var dy = Math.sin(t * Math.PI * 2 * 1.6) * 2.0;
          var dx = Math.sin(t * Math.PI * 2 * 0.9 + 1.2) * 1.2;
          var sw = Math.min(slice, w - sx);
          x.drawImage(off, Math.round(sx * dpr), 0, Math.round(sw * dpr), off.height, sx + dx, dy, sw, h);
        }
      }

      /* ── random crossing arcs ── */
      function drawArcs(x, w, h) {
        for (var i = 0; i < 3; i++) {
          x.save();
          x.strokeStyle = INKS[i % 3] + '0.35)';
          x.lineWidth = 0.8 + Math.random() * 0.9;
          x.beginPath();
          var y = Math.random() * h;
          x.moveTo(-4, y);
          x.bezierCurveTo(w * 0.3, y + (Math.random() - 0.5) * h * 0.9, w * 0.7, y + (Math.random() - 0.5) * h * 0.9, w + 4, y + (Math.random() - 0.5) * h * 0.5);
          x.stroke();
          x.restore();
        }
      }

      /* ── speckle ── */
      function drawSpeckle(x, w, h) {
        for (var i = 0; i < 60; i++) {
          x.fillStyle = 'rgba(' + (40 + rand(120)) + ',' + (50 + rand(110)) + ',' + (90 + rand(120)) + ',' + (0.15 + Math.random() * 0.3).toFixed(2) + ')';
          x.fillRect(Math.random() * w, Math.random() * h, Math.random() < 0.2 ? 2 : 1, 1);
        }
      }

      /* ── holographic sheen ── */
      function drawShine(x, w, h) {
        var g = x.createLinearGradient(0, h, w, 0);
        g.addColorStop(0, 'rgba(120,0,255,0)');
        g.addColorStop(0.45, 'rgba(0,180,255,0.07)');
        g.addColorStop(0.56, 'rgba(255,0,150,0.06)');
        g.addColorStop(1, 'rgba(120,0,255,0)');
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
      }

      function drawCode() {
        var c = ctx2d();
        var x = c.x, w = c.w, h = c.h, dpr = c.dpr;
        drawPaper(x, w, h);
        drawGuilloche(x, w, h);
        drawMicroText(x, w, h);
        drawThread(x, w, h);
        drawWatermark(x, w, h);

        var off = document.createElement('canvas');
        off.width = Math.round(w * dpr);
        off.height = Math.round(h * dpr);
        var ox = off.getContext('2d');
        ox.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawGlyphLayer(ox, w, h);
        warpBlit(x, off, w, h, dpr);

        drawArcs(x, w, h);
        drawSpeckle(x, w, h);
        drawShine(x, w, h);
      }

      function drawSolved() {
        var c = ctx2d();
        var x = c.x, w = c.w, h = c.h;
        var g = x.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#eefaf2');
        g.addColorStop(1, '#d9f5e5');
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);

        // faint green guilloche
        x.save();
        x.strokeStyle = 'rgba(26,158,75,0.14)';
        x.lineWidth = 0.7;
        var cx = w / 2, cy = h / 2, R = Math.min(w, h) * 1.15;
        for (var c2 = 0; c2 < 2; c2++) {
          x.beginPath();
          var k = 4 + c2;
          for (var i = 0; i <= 720; i++) {
            var a = i * Math.PI / 180;
            var rr = R * 0.6 * (0.55 + 0.5 * Math.cos(k * a));
            var px = cx + Math.cos(a) * rr * 1.05;
            var py = cy + Math.sin(a) * rr * 0.9;
            if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
          }
          x.stroke();
        }
        x.restore();

        x.strokeStyle = '#1a9e4b';
        x.lineWidth = 3;
        x.lineCap = 'round';
        x.lineJoin = 'round';
        x.beginPath();
        x.moveTo(w / 2 - 12, h / 2 + 1);
        x.lineTo(w / 2 - 3, h / 2 + 10);
        x.lineTo(w / 2 + 13, h / 2 - 9);
        x.stroke();

        drawSpeckle(x, w, h);
      }

      function setMsg(t, cls) {
        msg.textContent = t;
        msg.className = 'msg' + (cls ? ' ' + cls : '');
      }
      function shake() {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }

      function refreshCode() {
        if (solved) return;
        code = newCode();
        drawCode();
        inp.value = '';
        setMsg('');
        card.classList.remove('ok', 'bad');
      }

      function success() {
        solved = true;
        drawSolved();
        card.classList.add('ok');
        card.classList.remove('bad');
        setMsg('Проверка пройдена', 'ok');
        inp.disabled = true;
        check.disabled = true;
        refresh.disabled = true;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'captcha-success', source: 'i-studio' }, '*');
          }
        } catch (e) {}
      }

      function fail(t) {
        card.classList.add('bad');
        card.classList.remove('ok');
        setMsg(t || 'Неверный код, попробуйте ещё раз', 'bad');
        shake();
        inp.value = '';
        window.setTimeout(function () {
          if (solved) return;
          code = newCode();
          drawCode();
          inp.focus();
        }, 420);
      }

      function checkCode() {
        if (solved) return;
        if (hp.value) { hp.value = ''; fail('Не удалось подтвердить, что вы человек'); return; }
        var val = inp.value.trim().toUpperCase();
        if (!val) { card.classList.add('bad'); setMsg('Введите код', 'bad'); return; }
        if (val === code) success();
        else fail();
      }

      check.addEventListener('click', checkCode);
      refresh.addEventListener('click', refreshCode);
      cv.addEventListener('click', refreshCode);
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); checkCode(); }
      });
      inp.addEventListener('input', function () {
        inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
      window.addEventListener('resize', function () {
        if (solved) drawSolved(); else drawCode();
      });

      code = newCode();
      drawCode();
    })();
  </script>
</body>
</html>
